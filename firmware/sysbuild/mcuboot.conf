# 0x150000-byte slots / 4 KB sectors = 336 > the 128 default.
# BOOT_MAX_IMG_SECTORS_AUTO defaults to y under this Zephyr revision and gates
# BOOT_MAX_IMG_SECTORS (depends on !BOOT_MAX_IMG_SECTORS_AUTO); without
# turning it off explicitly, the literal 512 below is silently dropped.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512
# Belt-and-braces: MCUBOOT_BOOT_MAX_ALIGN defaults from the chosen
# zephyr,flash node's write-block-size (32, via sysbuild/mcuboot.overlay), but
# a stale build-sb Kconfig cache once left it at 4 -> BOOT_MAX_ALIGN=8 ->
# wrong trailer magic variant -> pending images silently ignored. Pin it.
CONFIG_MCUBOOT_BOOT_MAX_ALIGN=32
# MCUboot's own boot/zephyr/socs/esp32_procpu.conf force-sets
# CONFIG_MCUBOOT_LOG_LEVEL_OFF=y, which is why MCUboot has never printed a
# byte on this board. Override: INF shows banner + swap decisions ("Image
# upgrade secondary slot -> primary slot", "Starting swap using scratch").
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
# The SDK encrypted-erase-refill patch (tools/patches/, applied to
# zephyr/drivers/flash/flash_esp32.c) adds a static 4 KB sector buffer for its
# read-merge-erase-write path; the fixed ESP32 bootloader dram_seg then
# overflows by ~2.2 KB. The board Kconfig forces a 4 KB k_heap minimum
# (HEAP_MEM_POOL_ADD_SIZE_BOARD) that nothing in this tinycrypt-only
# bootloader allocates from; shrink it to make room.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=1024
# NOT SET: CONFIG_ESP_FLASH_ENCRYPTION is gated `depends on ... !MCUBOOT` in
# zephyr/soc/espressif/common/Kconfig.flash -- it configures the flash driver
# for a non-bootloader (app or bootloader-less) image, so it is not a valid
# symbol inside the MCUboot image's own Kconfig tree and silently drops here.
# The app already sets it (firmware/prj.conf); MCUboot's flash-encryption
# compatibility on ESP32 is unconditional platform code, not gated by this
# symbol. See task-1-report.md for how this was confirmed.
