# Touch-trace diagnostic build. Layered on prj.conf via
# -Dfirmware_EXTRA_CONF_FILE=trace.conf; pair with trace.overlay.
CONFIG_BLINK_TOUCH_TRACE=y

# The dump printk()s from the input thread, whose default 1024 B stack is sized
# for callbacks that only forward events.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# This file used to cut the LVGL pool to 27648, because the tracer's 1.5 KB
# ring and the bigger input stack overflowed dram1 by 612 B when the WiFi
# build had it ~99% full. dram1 has had ~40 KB free since the radio went, and
# a trace build at the release pool's 32768 uses 58628 of its 98304 B. The
# cut had become the bug: 27560 B usable is below what the board is measured
# to use opening Theme (27600) or a popup over Settings (28312), so a trace
# build ran dry, wrote through NULL and rebooted in the middle of the very
# trace it exists for (fp/pool review, S1). The pool is prj.conf's alone now,
# which tests/test_mem_stats_line.py pins for every overlay.
