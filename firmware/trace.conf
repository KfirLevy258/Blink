# Touch-trace diagnostic build. Layered on prj.conf via
# -Dfirmware_EXTRA_CONF_FILE=trace.conf; pair with trace.overlay.
CONFIG_CLAUGE_TOUCH_TRACE=y

# The dump printk()s from the input thread, whose default 1024 B stack is sized
# for callbacks that only forward events.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# The tracer's 1.5 KB ring plus the bigger input stack overflow dram1_0_seg by
# 612 B -- that segment is ~99% full in a release build. The LVGL pool lives in
# the same segment (.noinit.lvgl_pool), so give 3 KB of it back for the
# duration of the trace. 27648 is still well above the 16384 that once ran the
# gauge screen dry, and this file is never part of a release build.
CONFIG_LV_Z_MEM_POOL_SIZE=27648
