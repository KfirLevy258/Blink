# Standalone WiFi mode: the board fetches its own usage over the air.
#
# NOT part of a default build. Everything here exists to support
# CONFIG_BLINK_WIFI_MODE, which is default n -- see firmware/Kconfig for why.
# Enable the whole thing with:
#
#   west build --sysbuild -d build-sb -b esp32_devkitc/esp32/procpu . \
#     -- -DEXTRA_CONF_FILE=wifi.conf
#
# Keep this file and the Kconfig symbol in step: the symbol decides which
# SOURCES compile, this decides which Zephyr subsystems exist for them to call.
CONFIG_BLINK_WIFI_MODE=y

# --- Networking: WiFi + TLS (standalone mode) ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
# Without AP_STA_MODE the driver never creates a soft-AP net_if: the AP
# broadcasts, a phone associates, and then nothing answers its DHCP request --
# it just spins on "obtaining IP address" forever. Requires the WiFi network
# manager.
CONFIG_ESP32_WIFI_AP_STA_MODE=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2
# Defense-in-depth for the tight WiFi/system heap: a station associating to the
# SoftAP opens a BlockAck session whose RX_BA_WIN-sized reorder queue is allocated
# from that heap. AMPDU aggregation is a pure-throughput feature this once-a-minute
# usage display never needs, so turning it off drops that per-station allocation
# and eases heap pressure. (The actual join crash was a net_socket_service stack
# overflow + heap OOM, fixed above/below; this just keeps more slack.)
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
# Two interfaces (station + soft-AP) means two IPv4 contexts. This defaults to
# 1, and with only one the AP interface silently fails to take an address --
# net_if_ipv4_addr_add() just returns NULL.
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
# Hand out OURSELVES as the DNS server. Zephyr's default points somewhere else
# entirely, and with the wrong DNS the phone's captive-portal probe never
# reaches us: the OS decides "no internet" instead of "behind a portal" and
# quietly falls back to cellular without ever showing the setup page.
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
# Send the router (default gateway) option. OFF by default, but iOS REFUSES a
# DHCP lease that has no router option and spins on "obtaining IP" forever --
# macOS accepts it, which is why the Mac got an address and the iPhone did not.
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=y
# iOS usually does NOT set the DHCP broadcast flag, so the server unicasts its
# OFFER to the phone's MAC and must inject an ARP entry to do it. The default
# ARP table holds only 2 entries -- too small to reliably keep that mapping.
CONFIG_NET_ARP_TABLE_SIZE=16
# Kill the pre-offer ICMP probe: it adds a 1s stall per offer (long enough for
# iOS's DHCP client to give up and retry) and buys us nothing on a private
# 8-address pool we fully control.
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
# Bigger pool + short lease. Phones use a ROTATING private MAC, so every
# "forget and rejoin" during setup looks like a brand-new client. With the
# default of 4 addresses and a 24h lease, a few retries exhaust the pool and
# the board stops offering addresses -- the phone then just spins on
# "obtaining IP". A short lease lets stale reservations expire in minutes.
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=8
CONFIG_NET_DHCPV4_SERVER_ADDR_LEASE_TIME=300
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
# Connection/fd budget. Defaults are too small for what we run concurrently:
# the DHCP server, the DNS hijack socket, the TCP listener AND an accepted
# connection all need slots. At the default NET_MAX_CONN=4 incoming TCP is
# simply dropped -- ping works, HTTP does not.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_L2_ETHERNET=y
# NOT NET_CONFIG_SETTINGS/AUTO_INIT: it blocks at boot waiting for the iface to
# acquire an IPv4 address, which never happens before we have credentials -- it
# stalled main() entirely. We bring WiFi up ourselves.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# --- TLS ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# NOT the Zephyr static heap. CONFIG_MBEDTLS_ENABLE_HEAP=y reserves
# `static unsigned char _mbedtls_heap[CONFIG_MBEDTLS_HEAP_SIZE]`
# (modules/mbedtls/zephyr_init.c:37) for TLS whether TLS is running or not,
# while HEAP_MEM_POOL_SIZE separately reserves a worst case for WiFi. Two
# static worst cases do not fit on this chip: ~6 KB was free across dram0+dram1
# with mbedTLS at 32000, which is too little for the OTA download's 16 KB
# record buffer AND the release CDN's all-RSA certificate chain.
#
# The two peaks never coincide -- TLS is idle during provisioning, and the
# SoftAP is down in standalone mode when OTA runs -- so main.c points mbedTLS
# at the kernel heap (mbedtls_platform_set_calloc_free) and ONE pool sized to
# the larger peak replaces two sized to their sum.
#
# With ENABLE_HEAP=n, mbedTLS would otherwise fall back to libc calloc, and
# picolibc's heap here is ~5 KB ("libc heap size 5 kB" at boot) -- far too
# small. main.c's override is therefore load-bearing, not an optimisation.
CONFIG_MBEDTLS_ENABLE_HEAP=n
# Unused while ENABLE_HEAP=n (no static _mbedtls_heap is allocated); kept so a
# future revert to the static heap does not silently land on the Kconfig
# default. History, since it cost real hardware time to establish: with the
# static heap and pool at 55296, 32000 truncated the release CDN's all-RSA
# chain mid-parse (update check failed x509 -0x2700), 36000 linked but
# misbehaved (bogus HTTP status 618), and 40000 -- the smallest value that
# actually worked -- did not fit at all, overflowing dram0 by 1968 B.
CONFIG_MBEDTLS_HEAP_SIZE=32000
# Baseline for both record buffers, but src/mbedtls_user_config.h OVERRIDES
# them asymmetrically (IN=16384, OUT=2048). Zephyr maps this one symbol to
# both MBEDTLS_SSL_IN_CONTENT_LEN and _OUT_CONTENT_LEN, and inbound has to be
# 16384 -- the TLS maximum -- because GitHub's release CDN ramps to full-size
# records once a download passes ~32 KB. Outbound never needs more than a GET.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=6144
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"
# Config store: NOT settings/NVS. NVS needs erased flash to read as 0xFF,
# and with flash encryption enabled erased sectors read as decrypt-garbage
# (mount died with -EDEADLK on hardware, 2026-07-17; ESP-IDF exempts NVS
# from flash encryption for the same reason). cfg_store keeps its own A/B
# CRC-sealed record in the storage partition instead -- garbage-means-empty
# is by design there. CRC for the record seal.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
# This IS the heap the ESP32 WiFi driver allocates from (k_malloc-backed
# _system_heap; the esp heap_caps path is a stub here). A phone associating to
# the SoftAP allocates per-station buffers from it, and provisioning idle left
# only ~8.8 KB free -- the alloc failed ("esp32_wifi_adapter: memory allocation
# failed") and the driver then corrupted kernel memory into a fatal z_swap crash
# (measured 2026-07-24).
#
# The effective pool size is max(this, sum of HEAP_MEM_POOL_ADD_SIZE_* floors).
# The WiFi(40 KB)+board(4 KB)+getaddrinfo adds already floor it at ~45 KB, so any
# value below that (the old 16384) does NOTHING. Set ABOVE the floor to actually
# grow it: 55296 bought ~10 KB of real headroom (free ~8.8 -> ~19 KB), plenty for
# a station join (measured dipping only to ~17 KB).
#
# Since ENABLE_HEAP=n this pool is now ALSO the mbedTLS heap (main.c routes
# mbedtls_calloc here), so it must additionally cover a TLS session: an 16 KB
# inbound record buffer + 2 KB outbound + the peer certificate chain, ~20-25 KB
# for the OTA download, which is the heaviest user. Sized for the larger of the
# two peaks rather than their sum, which is the whole point -- they never
# overlap, as the SoftAP is down whenever OTA runs. 86016 replaces the old
# 55296 + 32000 static pair and still leaves dram0 headroom.
CONFIG_HEAP_MEM_POOL_SIZE=86016
# Packet pools. Trimmed once to 8/16 to save DRAM -- that was too far: a phone
# joining the SoftAP sprays small mDNS/discovery packets, the RX pool drains,
# and the TCP stack freezes at ESTABLISHED and never recovers (the known
# failure mode of zephyr#45426 / #55671: allocation stalls inside the stack).
# Verified on this hardware: handshake completed, then the whole RX path died.
# RX-heavy on purpose; inbound flood is the pressure source.
CONFIG_NET_BUF_RX_COUNT=28
# TX pool sized so a retransmission can ALWAYS allocate: Zephyr TCP clones
# the segment on resend, and with a ~2 KB portal page pinning 16 of 20 bufs a
# single frame lost on air could never be retransmitted -- the stack logged
# "TCP failed to allocate buffer in retransmission" and killed the
# connection (root cause of the captive-portal white pages, 2026-07-16).
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=14
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
# --- HTTP client for OAuth token calls + usage fetch ---
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=y
CONFIG_REBOOT=y



# This board's 3.3V rail sags under full-power radio bursts (observed:
# POWERON_RESETs at the moment a station associates, join handshakes timing
# out while scans work, and occasional boots with a blind radio). 11 dBm
# roughly quarters the peak PA current vs 20 dBm and is plenty for same-room
# provisioning and home-router range.
CONFIG_ESP32_PHY_MAX_TX_POWER=11

# Make SO_SNDTIMEO real: without this a UDP sendto blocks forever on buffer
# starvation, which is how the DNS hijack thread got wedged (its teardown
# then needs k_thread_abort and leaks the socket).
CONFIG_NET_CONTEXT_SNDTIMEO=y
# Same story for SO_RCVTIMEO: tz_fetch sets an 8 s recv timeout that was
# silently a no-op without this -- a stalled HTTP server would park the whole
# standalone loop (UI included) in recv() forever.
CONFIG_NET_CONTEXT_RCVTIMEO=y
# The default 3 s connect budget is a razor edge for TLS over a cellular
# hotspot: higher RTT, a ~6 KB certificate flight in 536-byte segments (MTU
# 576), and 1-2 s of ECDHE math on this CPU. The OAuth exchange timed out
# with -116 twice on an iPhone hotspot (2026-07-15) while the same exchange
# passed on hotel WiFi.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=20000

# Both Anthropic endpoints serve all-ECDSA chains (P-384 roots, SHA-384
# signatures) behind CDNs that only offer ECDHE + AEAD suites. Without these,
# every TLS handshake fails at connect() -- discovered the first time the
# OAuth exchange ran on hardware (2026-07-14).
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y

# TEMPORARY diagnostics: mbedTLS handshake tracing for the -113 abort.
CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_LOG_LEVEL_ERR=y

# Send SNI in the ClientHello. Compiled out, mbedTLS keeps the hostname only
# for local cert checks; Cloudflare-fronted hosts (console.anthropic.com)
# refuse SNI-less handshakes with alert 40 before ciphers are even weighed.
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
# The embedded root CAs (certs.h) are PEM text; without PEM support mbedTLS
# holds zero trusted CAs and every verify fails with "got no CA chain".
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# NIST-curve optimized arithmetic: the software P-384 handshake takes ~67 s
# without it and the peer gives up (-ETIMEDOUT). This is the single largest
# ECC speedup available in software.
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y


# Backlight dimming: the TFT backlight pin (GPIO21) runs on LEDC PWM so
# night mode can dim it; a bare GPIO only offered blinding or blank.
CONFIG_PWM=y

# Flash-encryption compatibility (with the MCUboot boot chain): the flash
# driver routes reads/writes through the encrypted paths once the eFuses
# enable encryption; harmless (virtual) before that.
CONFIG_ESP_FLASH_ENCRYPTION=y

