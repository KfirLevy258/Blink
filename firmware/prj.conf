# --- Console / logging ---
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Console UART access for protocol I/O ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Interrupt-driven RX. On a real UART (this board, unlike the C6's USB-CDC) the
# 128-byte FIFO holds ~11 ms at 115200 baud, so polling from the main loop drops
# bytes mid-line as soon as anything stalls it.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- Board identity for the hello message ---
CONFIG_HWINFO=y

# --- Heap / stacks ---
CONFIG_MAIN_STACK_SIZE=4096

# --- Display bring-up (CYD-T2 panel probe) ---
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9341=y
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_COLOR_DEPTH_16=y
# The ILI9341 takes big-endian RGB565 over SPI; the ESP32 is little-endian.
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=24576
# Partial rendering: 12% of the screen (~18 KB), NOT a 150 KB framebuffer.
# There is no PSRAM, and WiFi + mbedTLS still have to fit in the same 520 KB.
CONFIG_LV_Z_VDB_SIZE=12
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_Z_POINTER_INPUT=y
