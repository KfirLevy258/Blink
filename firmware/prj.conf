# --- Console / logging ---
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Every line this board sends the daemon -- hello, pref, pong, theme_now,
# theme_edit, ota_query, ota_flash -- is a printk (proto.c emit()), and with
# LOG_PRINTK every printk is a message in Zephyr's deferred log, next to
# LVGL's warnings and every "[tag]" diagnostic. Zephyr's defaults made that
# buffer lossy in the worst direction: when it was full the OLDEST message
# was thrown away (LOG_MODE_OVERFLOW), and the thread that empties it runs
# at the lowest application priority, so it does nothing while the main
# thread is busy with a Settings slide or a panel build. A reply queued
# just before such a stretch was pushed out by whatever followed it, and
# neither side said so: the bench image, with an 8 KB buffer, lost 22
# replies in one board run that way (25912f7), and a release image has 1 KB.
# On a desk that is an Install or an "Edit on computer" tap that does
# nothing.
#
# So a thread no longer loses a line to the buffer. A thread that finds it
# full waits for room (LOG_BLOCK_IN_THREAD) instead of evicting someone
# else's line: the main thread pauses for as long as the UART needs to drain
# the backlog, at 115200 baud about 0.36 s for the whole 4 KB below, rather
# than losing a protocol line. Zephyr 4.3.1's mpsc_pbuf_alloc tries that wait
# before its drop path, so a waiting thread never evicts anything, whatever
# LOG_MODE_OVERFLOW says. The trigger threshold of 1 wakes the log thread on
# the first queued line instead of at its tenth or at a 1 s timer, so a
# waiting writer waits only for the UART and a lone reply leaves at the main
# loop's next sleep.
#
# Three cases can still lose a line, and Zephyr counts each one and prints
# "--- N messages dropped ---":
#   - a thread that waited the full 1000 ms with no progress, which means a
#     log thread that has stopped (it never waits for itself); one 512 B
#     line drains in about 45 ms;
#   - a message that cannot wait: interrupt context, or interrupts locked.
#     No line in firmware/src is printed either way;
#   - the fault path, which is exactly that kind of writer: z_fatal_error
#     takes arch_irq_lock() before ">>> ZEPHYR FATAL ERROR", and the Xtensa
#     register dump (PC, EXCCAUSE, A0-A15) runs in exception context, both
#     before LOG_PANIC flushes the buffer.
# For those LOG_MODE_OVERFLOW stays at Zephyr's default, which drops the
# OLDEST queued line. It was turned off in 10bf7b4, and with a buffer full
# of LVGL's pool warnings a crash dump would then have been refused line by
# line: the one field fault this release worries about most would have lost
# the line that says where it was (fp/fix-fwlog review, S1). Evicting the
# oldest line is right only there, and only there does it happen.
#
# Why not a separate, direct UART writer for protocol lines: the log thread
# writes a line a byte at a time with uart_poll_out and is preempted mid-line
# whenever the main thread wakes, so a direct write would land inside half a
# diagnostic line and the daemon, which wants "{" first, would drop the
# reply anyway. Kept in one queue, every line comes out whole and in order.
#
# LVGL keeps logging at WARN, deliberately: the pool-exhaustion warnings,
# lv_draw_buf_create_ex's "No memory" and "Allocating layer buffer failed",
# are LV_LOG_WARN in LVGL 9 (lv_draw_buf.c, lv_draw.c), and they are what
# says the 30 KB pool ran dry before the board faults. With a thread's lines
# no longer evicted, they cost the panel time, not replies.
CONFIG_LOG_BLOCK_IN_THREAD=y
CONFIG_LOG_BLOCK_IN_THREAD_TIMEOUT_MS=1000
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

# --- Console UART access for protocol I/O ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Interrupt-driven RX. On a real UART (this board, unlike the C6's USB-CDC) the
# 128-byte FIFO holds ~11 ms at 115200 baud, so polling from the main loop drops
# bytes mid-line as soon as anything stalls it.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- Board identity for the hello message ---
CONFIG_HWINFO=y

# --- Heap / stacks ---
CONFIG_MAIN_STACK_SIZE=8192
# CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096 lived here for the SoftAP's DHCP
# server, whose 2400 B default stack overflowed (2026-07-24). The radio and
# the IP stack left the image on 2026-10-27, and the line only made every
# build warn that NET_SOCKETS_SERVICE, NET_SOCKETS and NETWORKING are off.
# Gone, so that a new warning in the build log gets noticed; git history has
# the story.
# Cheap insurance: turn a future stack overflow into a clean named reboot instead
# of silent memory corruption. THREAD_NAME makes the culprit legible in the dump.
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y

# --- Display bring-up (CYD-T2 panel probe) ---
CONFIG_SPI=y
# Explicitly OFF, which is also the Kconfig default -- kept as a line rather
# than a deletion so nobody re-adds it for the reason we did.
#
# It was set on 2026-07-27 to "sleep on the transfer-complete interrupt instead
# of busy-polling". The driver does not do that. With it on, transceive() arms
# the interrupt and falls straight through to spi_context_release() --
# spi_esp32_spim.c has no spi_context_wait_for_completion() call, and
# CONFIG_SPI_ASYNC is off, so the spi_context_complete() the ISR performs only
# gives a semaphore nobody takes. Every synchronous transfer became
# fire-and-forget: XPT2046 read its RX buffer before the words landed (16
# averaged reads per touch report), and display_write() returned with DMA still
# reading the caller's strip.
#
# The busy-poll it was meant to remove survives either way -- the
# `while (!spi_hal_usr_is_done(hal))` spin is still there, just moved into the
# ISR. And that ISR is registered ESP_INTR_FLAG_IRAM while its CS teardown
# reaches gpio_esp32_port_clear_bits_raw in .flash.text, so it would fault if it
# fired during an NVS or OTA write, when the flash cache is down.
CONFIG_SPI_ESP32_INTERRUPT=n
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9341=y
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_COLOR_DEPTH_16=y
# The ILI9341 takes big-endian RGB565 over SPI; the ESP32 is little-endian.
CONFIG_LV_COLOR_16_SWAP=y
# 32 KiB: gauge screen + settings overlay + confirm dialog coexist, and every
# redraw allocates transient draw tasks on top. 16 KiB ran dry there and LVGL
# NULL-derefed (no graceful malloc-failure path in lv_draw_add_task).
#
# Back to 32768 from 30720 (2026-10-28). The 2 KB had gone to the enlarged
# net_socket_service stack, which shared dram1 with this pool, and that stack
# left with the radio. The 30720 had been called "ample headroom" without a
# measurement, and the measurement disagreed: popups_touch peaked at 28312 B
# of the 30632 usable on the bench board (2320 B left). A failed-check notice
# landing on top of the install confirm -- reachable while Settings sits on
# "Install version X?" and the app stops answering -- measured +4632 B over
# Settings on the host harness, which maps to 0.65-1.3 KB left on the board
# (full review #2, M1; scratchpad rv2-mem). The confirm is now also taken down
# when the offer lapses (ui_settings.c, upd_timer_cb), so that stack should not
# form at all; this is the margin for whatever does.
#
# The pool is .noinit.lvgl_pool in dram1 (0x3ffeb800). dram1 is 98304 B and
# held 55556 B at f107c0c, so 42748 B were free before this 2048. The usable
# pool is 32680 B: the heap keeps the same 88 B of metadata as at 30720, since
# both sizes need twelve buckets (tools/board_touch.py, POOL_USABLE).
CONFIG_LV_Z_MEM_POOL_SIZE=32768
# Nobody had measured that headroom. gapietro's fork did, for its own 30 KB
# pool, whose settings panel had one more row than ours: on 2026-10-14 it
# stood at 23504 B used and 7128 B free just before the panel was drawn --
# and the draw exhausted it and halted the board. Hence the runtime
# stats: the board reports this pool on every screen change, as a
# "[mem] lvgl ..." line in bridge.log (fields explained in
# src/mem_stats.c). With the option off, lvgl_heap_stats() has
# no counters to read and reports nothing. The price is 16 B per heap (12 B
# of counters in 8-byte chunks) plus a few instructions per malloc/free.
# The heap array is how mem_stats.c reaches LVGL's heap, which the Zephyr
# module declares static; 8 slots is more than this image has heaps.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=8
# dram0 is full (growing the pool past 16 KiB fails to link), but dram1 has
# ~46 KiB spare behind the noinit output section. A .noinit.* section name
# routes the pool there; sys_heap_init formats it, so no zero-init needed.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME=".noinit.lvgl_pool"
# The resistive panel's contact bounce fires a burst of INT edges at touch
# down/up, each producing a full XPT2046 report; a burst can exceed the queue
# within one 10 ms LVGL cycle and drop the button press/release -> missed taps
# (seen on hardware 2026-07-18: a single touch dropped dozens of events).
# The LVGL glue drains the whole msgq every lv_timer_handler pass
# (continue_reading), so a deeper queue only absorbs the burst -- no latency.
# DRAM is nearly full (256 overflowed dram1 by 14 KB, 128 by 2.8 KB): 96 is
# the most that fits, a 50% bump. A driver-level debounce is the real fix if
# this still drops.
CONFIG_INPUT_QUEUE_MAX_MSGS=96
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=96
# Partial rendering, NOT a 150 KB framebuffer: this module has no PSRAM, so
# a whole-screen buffer would have to come out of the chip's 520 KB of SRAM,
# which the rest of the firmware already shares.
#
# The buffer is 12288 B, not the 6144 this comment used to claim. LV_Z_VDB_SIZE
# is a percentage of the screen, but the Zephyr glue turns it into bytes with
# LV_Z_BITS_PER_PIXEL (modules/lvgl/lvgl.c, BUFFER_SIZE), and that Kconfig lists
# an unconditional `default 32` BEFORE `default 16 if LV_COLOR_DEPTH_16` --
# first default wins, so it is 32 here despite our 16-bit colour.
# 32 * (4 * 320 * 240 / 100) / 8 = 12288, confirmed as .bss.buf0_0 = 0x3000.
#
# Nearly all of it is used: the full byte count goes to lv_display_set_buffers,
# which floors it to whole rows (12288 / 640 B stride = 19 rows), so LVGL renders
# 6080 RGB565 pixels per pass -- 8% of the screen, and ~13 render-and-flush passes
# for a full redraw, not 25. The ~128 B remainder is the row-alignment offcut.
#
# Setting CONFIG_LV_Z_BITS_PER_PIXEL=16 would make the number mean what it says
# and hand ~6 KB back, which is worth remembering: measured 2026-07-26, free
# DRAM is ~3.3 KB in dram0 (__bss_end 0x3ffdf300 vs heap sentry 0x3ffe0000)
# plus ~0.4 KB in dram1. It would also halve the flush chunk and double the
# pass count, so it is a lever for when DRAM gets tight, not a fix.
CONFIG_LV_Z_VDB_SIZE=4
# LVGL's own frame gate. The default 33 ms caps everything at 30 FPS, which is
# irrelevant to a full-screen redraw (124 ms, bounded elsewhere) but does bind
# on the cheap partial redraws, which measure ~5 ms.
#
# 16 does NOT buy a 16 ms period. The repeating lv_timer_handler() call sites
# here sit in loops that sleep between passes -- run_usb() in main.c sleeps
# 10 ms, ui_anim.c and ui_boot's clip playback 5 ms each -- so LVGL
# is never asked to refresh more often than that, and a 16 ms gate lands on
# the first pass that crosses it: ~20 ms either way. Real, but half what the
# number suggests.
#
# It does nothing for the countdown digits: usage_view_tick_1s() is called
# behind a `now - last_tick >= 1000` guard, so that text changes at 1 Hz no
# matter what this is set to.
CONFIG_LV_DEF_REFR_PERIOD=16
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_SPINNER=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_Z_POINTER_INPUT=y

# --- The WiFi link (spec S5.1; src/net_link.c, CONFIG_BLINK_WIFI_LINK) ---
#
# The radio came back on 2026-11-06 for one thing only: an encrypted link to
# the daemon on the owner's own network, instead of the cable. No TLS, DNS,
# HTTP, SNTP or SoftAP -- the deleted standalone mode (2026-10-27) had all of
# those, and the board still gets usage, the time and firmware only from the
# daemon. The Phase 0 RAM gate measured exactly this block on the bench board
# and passed it as one image for every board
# (docs/research/2026-11-wifi-ram-spike.md, "Verdict"; spike/wifi-ram).
#
# Dormant means the interface, not the driver (D42): with CONFIG_WIFI=y the
# driver's device initialiser runs esp_wifi_init() at boot on every board,
# paired or not, and its allocations come out of the heap below. What waits
# is net_if_up() -- the RF, DHCP and the sockets -- which an unpaired board
# never calls. That cost (driver initialised, interface down) is the spike's
# "unpaired" row.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
# One IPv4 address on one station interface; v6 is RAM for nothing on a LAN
# link the daemon finds by IPv4 broadcast (S5.6).
CONFIG_NET_IPV6=n
# The client only. The SoftAP's server is gone with the SoftAP.
CONFIG_NET_DHCPV4=y
# net_link.c reads the driver's connect result as "address bound": with this
# on, the driver raises it at DHCP_BOUND (esp_wifi_drv.c:83), not at
# association. It is the default with NET_DHCPV4; pinned because net_link.c
# BUILD_ASSERTs it.
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
# The session (TCP 49731) and the discovery responder (UDP 49731, D18).
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# The connect, disconnect and scan events net_link.c waits on.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
# Aggregation is a throughput feature for a link that carries a few frames a
# second, and each BlockAck session's reorder queue comes out of the heap.
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
# The brownout cap the old WiFi build measured on this board's supply. The
# 30-minute run on a phone charger at 11 dBm (S11) is still the owner's, and
# is due before feat/wifi-transport merges.
CONFIG_ESP32_PHY_MAX_TX_POWER=11

# The old wifi.conf's counts, sized for a SoftAP serving a portal page. S11
# lists trimming them as the first lever, and RAM passed the gate without any
# lever (heap low-water 38120 B free, dram1 12276 B free), so they stand as
# measured.
CONFIG_NET_BUF_RX_COUNT=28
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=14
CONFIG_NET_PKT_TX_COUNT=16

# Found by the spike, not levers: at Zephyr's defaults (4 and 3) the
# replacement session (D29) was answered with a reset at connect.
# NET_MAX_CONN counts every connection handler: DHCP's client on 68, the UDP
# responder, the TCP listener and the live session fill four, so the
# candidate needs a fifth, plus one for a replaced session still in
# TIME_WAIT (1.5 s).
CONFIG_NET_MAX_CONN=6
# zvfs_poll() takes at most this many entries, and the network thread polls
# four (listener, responder, candidate, session) while a replacement is
# under way.
CONFIG_ZVFS_POLL_MAX=4

# The handshake and the frame cipher (S6.2, S6.3): ChaCha20-Poly1305 and
# HKDF-SHA256 from mbedTLS 3.6.6, symbols checked in the 4.3.1 workspace
# (zephyr/modules/mbedtls/Kconfig.mbedtls). Still no TLS.
CONFIG_MBEDTLS_CIPHER_CHACHA20_ENABLED=y
CONFIG_MBEDTLS_POLY1305=y
CONFIG_MBEDTLS_CHACHAPOLY_AEAD_ENABLED=y
CONFIG_MBEDTLS_HKDF_C=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_SHA256=y
# sys_csrand_get, for the handshake's nonces. CSPRNG_ENABLED has no prompt in
# 4.3.1 (subsys/random/Kconfig:96): it follows ENTROPY_HAS_DRIVER on its own,
# so only the generator is set. The ESP32's RNG is a true RNG only while the
# RF is on, which it is whenever a nonce is drawn.
CONFIG_ENTROPY_GENERATOR=y

# Two stacks the gate's "every thread below 75 %" failed as built, each
# raised alone and re-measured (S11's 2026-11-06 note admits stack sizes as
# levers). 512 B of dram1 each.
#
# The deferred-log thread: 964 of 1024 B (94 %) on the spike and 916 (89 %)
# on the plain release image with no radio at all, so this was over the line
# before WiFi. 62 % at 1536.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
# The system work queue, which the driver and the net stack queue work on:
# 308 B on the plain image, 804 of 1024 (78 %) once the radio is up and after
# a rejoin. 52 % at 1536. net_link.c keeps its own blocking join off it.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# --- Config store, and the bits the display path needs ---
#
# These sat inside the old "Networking" block and moved out with it, which
# broke a USB-only build in ways that had nothing to do with the radio:
# IMG_MANAGER (OTA) depends on FLASH_MAP, and the backlight is a PWM. Every
# image needs them, radio or none.
#
# cfg_store is NOT settings/NVS: NVS needs erased flash to read as 0xFF, and
# with flash encryption on, erased sectors read as decrypt-garbage. It keeps
# its own A/B CRC-sealed record in the storage partition instead.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_REBOOT=y
CONFIG_PWM=y
CONFIG_ESP_FLASH_ENCRYPTION=y
# CONFIG_ZVFS_OPEN_MAX=16 sat here from the WiFi build's sockets; ZVFS is off
# without them, so it only made every build warn. Removed 2026-10-28. The
# WiFi link's sockets brought ZVFS back on 2026-11-06 and still need no line
# here: the net stack adds its own six descriptors (ZVFS_OPEN_ADD_SIZE_NET,
# from NET_MAX_CONTEXTS), which is what the spike ran on.
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
# Sized for the old WiFi build, where the driver and mbedTLS shared this
# pool, and the driver is back on it (the WiFi link above). The Phase 0 gate
# measured it before anyone touched it: low-water 38120 B free across join,
# scan, a ten-minute session, a replacement and a 1.3 MB OTA stream, largest
# chunk within 100 B of free at both instrumented low-water points. S11's
# lever list says right-size it from that number; RAM passed without it, so
# it stands. Too small shows up as an allocation failure deep in the driver,
# not as a build error.
CONFIG_HEAP_MEM_POOL_SIZE=86016

# --- Hashing for the OTA image check ---
#
# NOT a TLS stack -- there is none. ota.c verifies a streamed image against
# the manifest's sha256, and main.c routes mbedTLS's allocator at the kernel
# heap; both need mbedTLS present, neither needs a handshake. A hash brings no
# client id, no certificate and no network.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# --- OTA: image management + slot1 streaming ---
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_LV_USE_BAR=y
# OTA test boots arm the hardware watchdog: a hard-hung update image stops
# feeding, the chip resets, and MCUboot reverts to the previous version.
CONFIG_WATCHDOG=y
