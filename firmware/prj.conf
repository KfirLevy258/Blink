# --- Console / logging ---
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Console UART access for protocol I/O ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Interrupt-driven RX. On a real UART (this board, unlike the C6's USB-CDC) the
# 128-byte FIFO holds ~11 ms at 115200 baud, so polling from the main loop drops
# bytes mid-line as soon as anything stalls it.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- Board identity for the hello message ---
CONFIG_HWINFO=y

# --- Heap / stacks ---
CONFIG_MAIN_STACK_SIZE=8192
# A phone associating to the SoftAP is served by our custom DHCPv4 server (DNS +
# router options + unicast-OFFER ARP injection) which runs on the
# net_socket_service thread. Its 2400 B default stack overflowed on that path and
# corrupted kernel memory -> fatal fault in z_swap on the next context switch,
# crash-looping the board on every join (root cause pinned 2026-07-24 via
# STACK_SENTINEL, which named net_socket_service). 4096 B clears it with margin.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
# Cheap insurance: turn a future stack overflow into a clean named reboot instead
# of silent memory corruption. THREAD_NAME makes the culprit legible in the dump.
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y

# --- Display bring-up (CYD-T2 panel probe) ---
CONFIG_SPI=y
# Explicitly OFF, which is also the Kconfig default -- kept as a line rather
# than a deletion so nobody re-adds it for the reason we did.
#
# It was set on 2026-07-27 to "sleep on the transfer-complete interrupt instead
# of busy-polling". The driver does not do that. With it on, transceive() arms
# the interrupt and falls straight through to spi_context_release() --
# spi_esp32_spim.c has no spi_context_wait_for_completion() call, and
# CONFIG_SPI_ASYNC is off, so the spi_context_complete() the ISR performs only
# gives a semaphore nobody takes. Every synchronous transfer became
# fire-and-forget: XPT2046 read its RX buffer before the words landed (16
# averaged reads per touch report), and display_write() returned with DMA still
# reading the caller's strip.
#
# The busy-poll it was meant to remove survives either way -- the
# `while (!spi_hal_usr_is_done(hal))` spin is still there, just moved into the
# ISR. And that ISR is registered ESP_INTR_FLAG_IRAM while its CS teardown
# reaches gpio_esp32_port_clear_bits_raw in .flash.text, so it would fault if it
# fired during an NVS or OTA write, when the flash cache is down.
CONFIG_SPI_ESP32_INTERRUPT=n
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9341=y
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_COLOR_DEPTH_16=y
# The ILI9341 takes big-endian RGB565 over SPI; the ESP32 is little-endian.
CONFIG_LV_COLOR_16_SWAP=y
# 32 KiB: gauge screen + settings overlay + confirm dialog coexist, and every
# redraw allocates transient draw tasks on top. 16 KiB ran dry there and LVGL
# NULL-derefed (no graceful malloc-failure path in lv_draw_add_task).
# 30720 (was 32768): 2 KB went to the enlarged net_socket_service stack, which
# shares dram1 with this pool. Still ~2x the 16 KB that once ran dry on the gauge
# screen, so ample headroom remains.
CONFIG_LV_Z_MEM_POOL_SIZE=30720
# dram0 is full (growing the pool past 16 KiB fails to link), but dram1 has
# ~46 KiB spare behind the noinit output section. A .noinit.* section name
# routes the pool there; sys_heap_init formats it, so no zero-init needed.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME=".noinit.lvgl_pool"
# The resistive panel's contact bounce fires a burst of INT edges at touch
# down/up, each producing a full XPT2046 report; a burst can exceed the queue
# within one 10 ms LVGL cycle and drop the button press/release -> missed taps
# (seen on hardware 2026-07-18: a single touch dropped dozens of events).
# The LVGL glue drains the whole msgq every lv_timer_handler pass
# (continue_reading), so a deeper queue only absorbs the burst -- no latency.
# DRAM is nearly full (256 overflowed dram1 by 14 KB, 128 by 2.8 KB): 96 is
# the most that fits, a 50% bump. A driver-level debounce is the real fix if
# this still drops.
CONFIG_INPUT_QUEUE_MAX_MSGS=96
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=96
# Partial rendering, NOT a 150 KB framebuffer: there is no PSRAM, and WiFi +
# mbedTLS still have to fit in the same 520 KB.
#
# The buffer is 12288 B, not the 6144 this comment used to claim. LV_Z_VDB_SIZE
# is a percentage of the screen, but the Zephyr glue turns it into bytes with
# LV_Z_BITS_PER_PIXEL (modules/lvgl/lvgl.c, BUFFER_SIZE), and that Kconfig lists
# an unconditional `default 32` BEFORE `default 16 if LV_COLOR_DEPTH_16` --
# first default wins, so it is 32 here despite our 16-bit colour.
# 32 * (4 * 320 * 240 / 100) / 8 = 12288, confirmed as .bss.buf0_0 = 0x3000.
#
# Nearly all of it is used: the full byte count goes to lv_display_set_buffers,
# which floors it to whole rows (12288 / 640 B stride = 19 rows), so LVGL renders
# 6080 RGB565 pixels per pass -- 8% of the screen, and ~13 render-and-flush passes
# for a full redraw, not 25. The ~128 B remainder is the row-alignment offcut.
#
# Setting CONFIG_LV_Z_BITS_PER_PIXEL=16 would make the number mean what it says
# and hand ~6 KB back, which is worth remembering: measured 2026-07-26, free
# DRAM is ~3.3 KB in dram0 (__bss_end 0x3ffdf300 vs heap sentry 0x3ffe0000)
# plus ~0.4 KB in dram1. It would also halve the flush chunk and double the
# pass count, so it is a lever for when DRAM gets tight, not a fix.
CONFIG_LV_Z_VDB_SIZE=4
# LVGL's own frame gate. The default 33 ms caps everything at 30 FPS, which is
# irrelevant to a full-screen redraw (124 ms, bounded elsewhere) but does bind
# on the cheap partial redraws, which measure ~5 ms.
#
# 16 does NOT buy a 16 ms period. The repeating lv_timer_handler() call sites
# here sit in loops that sleep between passes -- 10 ms in main.c's mode loops
# and wifi_settle, 5 ms in ui_anim.c and in ui_boot's clip playback -- so LVGL
# is never asked to refresh more often than that, and a 16 ms gate lands on
# the first pass that crosses it: ~20 ms either way. Real, but half what the
# number suggests.
#
# It does nothing for the countdown digits: usage_view_tick_1s() is called
# behind a `now - last_tick >= 1000` guard, so that text changes at 1 Hz no
# matter what this is set to.
CONFIG_LV_DEF_REFR_PERIOD=16
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_SPINNER=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_Z_POINTER_INPUT=y

# --- Networking ---
#
# The WiFi driver, the IP stack, TLS and the HTTP client used to live here and
# were built into every image. They now live in wifi.conf and are pulled in
# only by CONFIG_CLAUGE_WIFI_MODE, because a USB-only unit needs none of them:
# the daemon on the customer's machine supplies usage, time and firmware, and
# a radio that is never used is still flash, still RAM, and still the OAuth
# client id and refresh token sitting in a shipped binary.
#
#   west build ... -- -DEXTRA_CONF_FILE=wifi.conf     (to get them back)

# --- Config store, and the bits the display path needs ---
#
# These sat inside the old "Networking" block and moved out with it, which
# broke a USB-only build in ways that had nothing to do with the radio:
# IMG_MANAGER (OTA) depends on FLASH_MAP, and the backlight is a PWM. They
# belong to the board, not to WiFi. wifi.conf still sets the same values, and
# an identical assignment in both files is harmless.
#
# cfg_store is NOT settings/NVS: NVS needs erased flash to read as 0xFF, and
# with flash encryption on, erased sectors read as decrypt-garbage. It keeps
# its own A/B CRC-sealed record in the storage partition instead.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_REBOOT=y
CONFIG_PWM=y
CONFIG_ESP_FLASH_ENCRYPTION=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
# Sized for the WiFi build, where the driver and mbedTLS share this pool. A
# USB-only image has neither and could almost certainly run on far less --
# worth measuring before trimming, since getting it wrong shows up as an
# allocation failure deep in a driver rather than as a build error.
CONFIG_HEAP_MEM_POOL_SIZE=86016

# --- Hashing for the OTA image check ---
#
# NOT the TLS stack, which lives in wifi.conf. ota.c verifies a streamed image
# against the manifest's sha256, and main.c routes mbedTLS's allocator at the
# kernel heap; both need mbedTLS present, neither needs a handshake. A hash
# brings no client id, no certificate and no network.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# --- OTA: image management + slot1 streaming ---
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_LV_USE_BAR=y
# OTA test boots arm the hardware watchdog: a hard-hung update image stops
# feeding, the chip resets, and MCUboot reverts to the previous version.
CONFIG_WATCHDOG=y
