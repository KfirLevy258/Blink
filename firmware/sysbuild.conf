SB_CONFIG_BOOTLOADER_MCUBOOT=y
# ECDSA P-256 (tinycrypt), NOT ed25519: the ed25519 verifier (~20 KB of fiat
# curve25519 code) overflows the ESP32's fixed 40 KB bootloader iram_seg by
# ~10 KB -- it cannot link, in either swap mode. P-256 via tinycrypt fits with
# ~3.7 KB slack (sizing runs 2026-07-18; user-approved decision).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# The signing-key path is supplied at build time via
# -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=... (sysbuild does not expand ~, and no
# local path should live in the tree). tools/release.sh passes it; for a manual
# build add e.g. -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="$HOME/.clauge/ota_signing_key_p256.pem".
# Swap with revert (NOT upgrade-only overwrite, which cannot roll back).
#
# swap-using-move, not swap-using-scratch. Scratch moves every sector through
# the scratch partition, so each sector is written three times, and on this
# flash-encrypted part every write is a read-modify-erase-write -- the swap
# took ~4-5 MINUTES of frozen screen for a 1.28 MB image (host-clock measured
# 2026-07-25; see the warning below about the bootloader's own timestamps).
# swap-move shifts the primary image up one sector and copies in place, with
# no scratch round-trip, so it moves substantially less data.
#
# WARNING for anyone measuring this: MCUboot's own log timestamps on this SoC
# are WRONG by roughly 15x -- it reported "16.9 s" for a swap that took 237+ s
# by the host clock, because the bootloader's millisecond counter is calibrated
# for a different CPU frequency than it actually runs at. Time swaps from
# outside the device, never from the "I (nnnnn)" prefixes.
#
# swap-move needs one spare sector in the primary slot (it shifts the image up
# to make room): slot 0x150000 - 4096 = 1372160 B usable vs a ~1.28 MB image.
# The scratch partition is left in the DT but is unused in this mode.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
