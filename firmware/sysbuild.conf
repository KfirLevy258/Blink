SB_CONFIG_BOOTLOADER_MCUBOOT=y
# ECDSA P-256 (tinycrypt), NOT ed25519: the ed25519 verifier (~20 KB of fiat
# curve25519 code) overflows the ESP32's fixed 40 KB bootloader iram_seg by
# ~10 KB -- it cannot link, in either swap mode. P-256 via tinycrypt fits with
# ~3.7 KB slack (sizing runs 2026-07-18; user-approved decision).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# The signing-key path is supplied at build time via
# -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=... (sysbuild does not expand ~, and no
# local path should live in the tree). tools/release.sh passes it; for a manual
# build add e.g. -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="$HOME/.clauge/ota_signing_key_p256.pem".
# Swap with revert instead of the old upgrade-only overwrite.
# NB: this Zephyr revision's Kconfig symbol is MCUBOOT_MODE_SWAP_SCRATCH, not
# MCUBOOT_MODE_SWAP_USING_SCRATCH (confirmed via
# zephyr/share/sysbuild/images/bootloader/Kconfig); it still maps to
# CONFIG_BOOT_SWAP_USING_SCRATCH in the mcuboot image's .config.
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
