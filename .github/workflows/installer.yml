name: installer

# The installer is part of the device now: it edits a file the customer owns,
# without asking, on a machine we have never seen. That is the case for gating
# merges on it running everywhere rather than on the one Mac it was written on.
on:
  pull_request:
  # Every branch, not just main. Waiting for a pull request to find out that
  # the installer breaks on Linux means finding out late, and the work that
  # produced this file was several commits deep on a branch before anything
  # could have run at all.
  #
  # Branches only, though. A bare `push:` includes TAG pushes, so cutting a
  # release ran this entire 38-job suite against the same commit CI had
  # already checked minutes earlier -- seen doing exactly that during the
  # release rehearsal.
  push:
    branches: ['**']
  workflow_dispatch:

# Git Bash on the Windows runners, so one script works on all three.
defaults:
  run:
    shell: bash

concurrency:
  # Keyed on the BRANCH NAME, which is the one thing both events agree on.
  #
  # A push to a branch with an open PR fires `push` and `pull_request` both.
  # github.ref differs between them (refs/heads/X against refs/pull/N/merge)
  # and so does the PR number, which is null on a push -- so keying on either
  # put the two events in different groups and ran all 38 jobs twice. Observed
  # doing exactly that after the first attempt at this: two successful runs,
  # same commit, same minute.
  group: installer-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Every scenario, hermetically, on both OSes and at both ends of the Python
  # range the installer claims to support. Fast, and it is where a broken
  # scenario is easiest to read.
  unit:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a cross product: setup-python publishes no
        # arm64 build for 3.9, so macos-latest x 3.9 would fail on the runner
        # rather than on anything we wrote. The macOS side of the 3.9 floor is
        # covered by the macos-system-python job below, on a better
        # interpreter than setup-python could have given us anyway.
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
          # The suite itself on Windows, not only the installed binary: the
          # Desktop cache path, the Scheduled Task backend and the CRLF-free
          # shim writes all have Windows-only branches that only a Windows
          # interpreter reaches.
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet -r tests/requirements.txt
      - run: python -m pytest tests/ -q

  # The Python a Mac already has. This started as a macos-13 x py3.9 entry in
  # the matrix above, which never once got scheduled across four runs -- x86
  # macOS runners are scarce, and gating every merge on the scarcest image is
  # a bad trade. Using the system interpreter is not a workaround, it is the
  # better test: macOS ships python3 3.9.x with the command line tools, so
  # this is the exact interpreter most customers will run the daemon on, and
  # the floor install.sh enforces.
  macos-system-python:
    name: tests (macOS system python3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: which python does macOS ship
        run: /usr/bin/python3 --version
      - name: run the suite on it
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/sysvenv"
          "$RUNNER_TEMP/sysvenv/bin/python" -m pip install --quiet -r tests/requirements.txt
          "$RUNNER_TEMP/sysvenv/bin/python" -m pytest tests/ -q

  # Build the shipped artifact once per platform, then let every scenario test
  # THAT rather than the source. A scenario passing against the module while
  # the frozen binary is missing a data file would be a green tick on the one
  # thing customers actually run.
  build:
    name: build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sh tools/build_binary.sh

      # The old smoke test was `./dist/blink* status || true`, which asserted
      # nothing: it swallowed every failure, and on the Windows runner the
      # default shell could not even expand that glob, so it had never run
      # there at all.
      #
      # It matters more now that build_binary.sh passes --exclude-module. A
      # wrong exclusion does not fail the build -- it produces a binary that
      # dies on the first import of the thing that was dropped, which for the
      # update path is a signature check and for the flash path is esptool.
      # Neither is reached by `status`, so each is driven directly below.
      - name: smoke test the binary
        shell: bash
        run: |
          set -eu
          bin=dist/blink
          [ -f "$bin" ] || bin=dist/blink.exe
          echo "size: $(du -h "$bin" | cut -f1)"

          "$bin" --version
          "$bin" status

          # Drives fetch_signed_manifest() -> verify_signature(), the one
          # code path that imports ecdsa, against the live release feed.
          #
          # Not a bare exit-0 check: an unreachable feed is a GitHub outage,
          # not a defect in this binary, and failing CI for it would make
          # this job flaky for a reason it cannot fix. A binary that cannot
          # verify a signature does not print either of these lines -- it
          # raises, and `set -e` catches that.
          # BLINK_SKIP_SERVICE, because cmd_update restarts the login
          # service on success and this runner has none -- the same guard
          # release-binaries.yml and check_install.sh already set.
          out=$(BLINK_SKIP_SERVICE=1 "$bin" update 2>&1) || true
          echo "$out"
          # All FOUR terminal outputs, not two.
          #
          # cmd_update can also say "Downloading <version> ..." (a newer
          # release is published -- the normal state of any pre-release
          # branch, which is every branch until the tag is cut) or "There is
          # no published build for <platform>". Both used to fall through to
          # exit 1 and fail the job for doing exactly what they should.
          #
          # The download branch is worse than a false failure: by the time it
          # printed, update.apply() had already replaced ~/.blink/bin/blink
          # on the runner. That is fine here -- the artifact is uploaded from
          # dist/, not from ~ -- but it is why this step must not be treated
          # as read-only.
          case "$out" in
            *"Already up to date"*|*"Could not read the release feed"*) ;;
            *"Downloading"*|*"no published build for"*) ;;
            *) echo "FATAL: update path did not complete" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: blink-${{ matrix.os }}
          path: dist/blink*
          retention-days: 7

  # The step no unit test reaches, because it touches the machine: registering
  # a login service. One runner per scenario, installing for real.
  real-install:
    name: install (${{ matrix.os }}, ${{ matrix.scenario }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scenario:
          - no-claude          # Claude Code never installed
          - no-settings        # ~/.claude exists, settings.json does not
          - no-statusline      # settings.json with no statusLine key
          - with-statusline    # their own bar, must survive and still render
          - reinstall          # twice in a row, must not chain to itself
          - foreign-uninstall  # never installed; must not touch their bar
          - spaced-home        # a HOME path containing spaces
          # The data paths, through the installed pieces: a status line
          # render, hook events, a Desktop cache, a Codex log -- then what
          # `status` says and what `status --wire` would send the board.
          - all-sources        # everything present, both sessions counted
          - desktop-only       # percentages and a burn rate, no reset time
          - codex-only         # codex primary with both countdowns
          - broken-data        # two unparseable files: named, and nothing sent
          # The sequences a customer actually makes.
          - install-uninstall-install  # came back: their bar chained again, not our stale shim
          - home-wiped-uninstall       # deleted ~/.blink by hand, then uninstalled
          - unreadable-settings        # settings.json does not parse: refuse, change nothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blink-${{ matrix.os }}
          path: dist
      - run: chmod +x dist/blink*
      # HOME is redirected inside the script, but the launchd label and the
      # systemd unit name are constants -- fine on a throwaway runner, which is
      # the whole reason this job cannot be a local test.
      - run: sh tests/ci/check_install.sh ${{ matrix.scenario }}

  # The binary replacing itself, against a locally signed feed. Separate from
  # the scenario matrix because it needs a keypair and a fake release, and
  # because what it proves is different: not that the install is correct, but
  # that the SHIPPED artifact can verify a signature and survive overwriting
  # its own file. A missing signature library shows up here and nowhere else.
  self-update:
    name: self-update (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # POSIX only: the stand-in for "a newer release" is a script that
        # prints a version, and Windows will not execute one named .exe. The
        # Windows-specific half -- renaming a running executable out of the
        # way -- is covered by tests/pc/test_update.py.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blink-${{ matrix.os }}
          path: dist
      - run: chmod +x dist/blink*
      - run: sh tests/ci/check_update.sh

  # The firmware's pure logic, compiled and run on a plain runner. native_sim
  # is Linux-only and most of this project is written on a Mac, so these are
  # how the C gets exercised without a board -- and nothing ran them
  # automatically until this job existed.
  host-tests:
    name: firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/ci/check_host_tests.sh

  # The factory scripts -- tools/burn.sh and tools/flash_encrypted.sh -- run
  # for real against a scripted board and stub esptool/espefuse/espsecure
  # (tests/ci/fakes). These two scripts decide what a unit IS: its edition,
  # whether it carries a company logo, whether it can ever take an update.
  # Nothing else exercises them without a board on somebody's desk.
  factory-scripts:
    name: factory scripts (fake board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r tests/requirements.txt
      - run: sh tests/ci/check_factory.sh

  # The shim runs on every single status line render, under whatever /bin/sh
  # the customer's machine has. A bashism here is a broken bar for everyone.
  shim-posix:
    name: shim under ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [dash, busybox, bash]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dash busybox
      - run: sh tests/ci/check_shim.sh ${{ matrix.shell }}
      # The hook shim runs on every TOOL CALL, which is far more often than
      # the status line renders, and Claude Code runs it inline -- so a stray
      # byte on stdout or stderr lands in the user's session.
      - run: sh tests/ci/check_hook_shim.sh ${{ matrix.shell }}

  # We read a field of Claude Code's status line payload that carries no
  # stability commitment. That is the risk you cannot design around, only
  # watch -- so watch it here, on every merge, across the versions customers
  # actually have. A red job here means the daemon's mapping needs updating
  # before anything ships, not after boards go dark together.
  #
  # It runs credential-free, so it proves the contract is PRESENT in a release,
  # not that a signed-in user's payload is populated. That distinction is
  # written into tests/ci/check_claude_version.sh.
  claude-versions:
    name: claude ${{ matrix.label }} (${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Linux binary is already built and uploaded by `build`. Compiling it
    # again in all four cells cost four PyInstaller runs to produce four
    # identical artifacts.
    needs: build
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2.1.100 is not arbitrary: 2.1.0 does not carry rate_limits at all
          # and 2.1.100 does, so this is near the real floor. Anything older is
          # a version this product cannot work on, whatever the README says.
          - {label: old, version: '2.1.100', experimental: false, os: ubuntu-latest}
          - {label: stable, version: 'stable', experimental: false, os: ubuntu-latest}
          - {label: latest, version: 'latest', experimental: false, os: ubuntu-latest}
          # The preview channel: an early warning, never a merge blocker. A
          # contract change landing in `next` is exactly the signal worth
          # having weeks before it reaches customers.
          - {label: next, version: 'next', experimental: true, os: ubuntu-latest}
          # The same real CLI on the other two platforms. What this adds is
          # not the contract (same package) but the LOCATION: the installer
          # and Claude Code have to agree on where settings.json lives on a
          # Windows profile and a macOS home, and only running both there
          # proves they do.
          - {label: stable, version: 'stable', experimental: false, os: macos-latest}
          - {label: stable, version: 'stable', experimental: false, os: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: blink-${{ matrix.os }}
          path: dist
      - run: chmod +x dist/blink*
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.version }}
      - run: claude --version
      - run: sh tests/ci/check_claude_version.sh

  # The Codex side of the same watch. Codex is open source, so instead of
  # installing it (which could not produce a rollout without an account) this
  # reads the struct that defines the rate_limits object at the ref that
  # ships, and fails the day a field we read is renamed or dropped. The
  # parser itself is pinned to a real captured log in tests/fixtures.
  codex-contract:
    name: codex contract (${{ matrix.ref }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tip of the tree: an early warning, never a merge blocker.
          - {ref: main, experimental: true}
          # The latest release, resolved at run time below.
          - {ref: release, experimental: false}
    steps:
      - uses: actions/checkout@v4
      - name: resolve the ref
        id: ref
        run: |
          if [ "${{ matrix.ref }}" = release ]; then
            tag=$(curl -fsSL https://api.github.com/repos/openai/codex/releases/latest | jq -r .tag_name)
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - run: sh tests/ci/check_codex_contract.sh "${{ steps.ref.outputs.ref }}"

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` is not in scope for that
    # step's `name`, so the version would render blank in the log.
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt's. Ubuntu ships an older shellcheck than a developer
      # is likely to have, and the first run failed on a finding that the
      # newer local version does not emit -- a CI failure nobody could
      # reproduce. Same binary here and on a laptop.
      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/
          shellcheck --version
      # -s sh: these must be POSIX. Checking them as bash would let a bashism
      # through that breaks the /bin/sh they actually run under.
      - run: shellcheck -s sh tools/blink-statusline.sh tools/blink-hook.sh tools/build_binary.sh tests/ci/*.sh

      # The firmware and the daemon ship from one tag. A disagreement here is
      # invisible everywhere else -- it builds, it tests, it runs -- and only
      # shows up as a customer whose two halves introduce themselves
      # differently.
      - name: firmware and daemon versions agree
        run: sh tests/ci/check_versions.sh
      - name: reject CRLF line endings
        run: |
          if grep -rlU $'\r' tools/blink-statusline.sh tools/blink-hook.sh tools/build_binary.sh tests/ci/; then
            echo "CRLF found: a shim with CRLF fails with 'bad interpreter'" >&2
            exit 1
          fi
